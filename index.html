<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0e7">
  <title>A little something for you</title>
  <style>
    :root {
      --paper: #f5f0e7;
      --ink: #263c76;
      --muted: #766b61;
      --line: #d4c9b9;
      --card: #e8dfd1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px 16px; background: var(--paper); color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      width: min(100%, 430px); text-align: center; padding: 30px 22px;
      border: 1px solid var(--line); border-radius: 22px;
      background: rgba(255,255,255,.22); box-shadow: 0 12px 35px rgba(55,45,30,.07);
    }
    .eyebrow {
      font: 600 11px/1.4 Arial, sans-serif; letter-spacing: .19em;
      color: var(--muted); text-transform: uppercase;
    }
    h1 { margin: 22px 0 8px; font-size: clamp(38px, 11vw, 52px); font-style: italic; }
    .intro { margin: 0; color: var(--muted); font: 16px/1.6 Arial, sans-serif; }
    .doodle { margin: 27px auto 20px; width: 130px; height: 82px; }
    .note { margin: 0 0 22px; color: var(--muted); font: 14px/1.6 Arial, sans-serif; }
    .play-link {
      display: block; width: 100%; border-radius: 999px; padding: 16px 18px;
      background: var(--ink); color: white; text-decoration: none;
      font: 600 14px Arial, sans-serif;
    }
    button {
      width: 100%; border: 0; border-radius: 999px; padding: 16px 18px;
      background: var(--ink); color: white; font: 600 14px Arial, sans-serif;
      cursor: pointer; transition: transform .15s ease, opacity .15s ease;
    }
    button:active { transform: scale(.985); }
    button:focus-visible { outline: 3px solid #9aa9d0; outline-offset: 3px; }
    .reveal { display: none; margin-top: 26px; padding: 22px 16px 16px;
      border-radius: 18px; background: var(--card); }
    .reveal.show { display: block; animation: appear .55s ease both; }
    @keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .music-icon { font-size: 35px; margin-bottom: 8px; }
    h2 { margin: 0 0 7px; font-size: 28px; font-style: italic; }
    .song-caption { color: var(--muted); font: 13px/1.5 Arial, sans-serif; margin: 0 0 17px; }
    .player-wrap { overflow: hidden; border-radius: 12px; background: #171717; }
    iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; }
    .fallback { margin: 12px 0 0; font: 12px/1.5 Arial, sans-serif; color: var(--muted); }
    .fallback a { color: var(--ink); }
    .closing { margin: 23px 0 8px; font-size: 16px; font-style: italic; }
    .signature { margin: 0; color: var(--muted); font: 12px Arial, sans-serif; }
    .tiny { margin-top: 24px; color: #9a8e80; font: 10px Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">A little something for you</div>
    <h1>Hey, madam. :p</h1>
    <p class="intro">Enti, QR kuda scan chesesava? 😂</p>

    <svg class="doodle" viewBox="0 0 150 90" fill="none" aria-label="Headphones doodle">
      <path d="M24 53V43C24 15 43 5 75 5s51 10 51 38v10" stroke="#263c76" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="15" y="45" width="22" height="35" rx="9" transform="rotate(-8 15 45)" stroke="#263c76" stroke-width="3"/>
      <rect x="113" y="43" width="22" height="35" rx="9" transform="rotate(8 113 43)" stroke="#263c76" stroke-width="3"/>
      <path d="M54 27c8-7 31-8 42 0" stroke="#263c76" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6"/>
      <path d="M67 64c5 5 12 5 17 0" stroke="#263c76" stroke-width="2" stroke-linecap="round"/>
    </svg>

    <p class="note">Sare, oka chinna surprise undhi...</p>
    <button id="revealButton" type="button">There's something here for you</button>

    <section id="songReveal" class="reveal" aria-live="polite">
      <div class="music-icon">♫</div>
      <p class="song-caption">Okay, headphones pettuko. This one's for you.</p>
      <a class="play-link" href="https://www.youtube.com/watch?v=puyhcl4g1Kw"
         target="_blank" rel="noopener noreferrer">Play the song</a>
      <p class="closing">Okay, that's all. Don't overthink it. :p</p>
    </section>
    <div class="tiny">a tiny corner of the internet</div>
  </main>

  <script>
    const button = document.getElementById("revealButton");
    const reveal = document.getElementById("songReveal");
    const player = document.getElementById("youtubePlayer");
    const videoId = "puyhcl4g1Kw";

    button.addEventListener("click", () => {
      reveal.classList.add("show");
      player.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&playsinline=1&rel=0`;
      button.textContent = "Surprise revealed";
      button.disabled = true;
      button.style.opacity = ".7";
      reveal.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
  </script>
</body>
</html>
